# touch 2026-05-25 — force Railway redeploy to pick up Xbox sync diagnostic
# fetch. Watch Paths config still suspect; bumping this comment is the
# cheapest force-trigger until the dashboard is healthy enough to audit
# the config.

[build]
builder = "nixpacks"
buildCommand = "npm run build --workspace=apps/api"

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
