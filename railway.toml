# touch 2026-05-26 sub-unit #4.4 — wire applyXboxPlaytimeBackground
# into the Xbox sync flow. Fire-and-forget mirror of Steam's
# achievements pass; library lands fast, playtime trickles in within
# seconds. Diagnostic block removed (we have ground truth now).

[build]
builder = "nixpacks"
buildCommand = "npm run build --workspace=apps/api"

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
