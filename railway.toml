# touch 2026-05-26 round 6 — wider playtime probe: full v3 achievements
# response (start+size+end) + POST /v2/player/stats with MinutesPlayed
# stat name. Belt-and-suspenders against the OpenAPI spec's hint.

[build]
builder = "nixpacks"
buildCommand = "npm run build --workspace=apps/api"

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
